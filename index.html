<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0c0f;
      --surface:  #13151a;
      --border:   #1e2028;
      --accent:   #c8f04a;
      --accent2:  #697A21;
      --text:     #e8eaf0;
      --muted:    #555966;
      --radius:   6px;
      --mono:     'Space Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
    }
    header h1 span { color: var(--accent); }

    .divider {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── CONTROL PANEL ── */
    .panel {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 70%);
    }

    .panel-label {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      font-family: var(--mono);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .field label {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .field input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1.25rem;
      padding: 12px 16px;
      width: 100%;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -moz-appearance: textfield;
    }
    .field input[type="number"]::-webkit-inner-spin-button,
    .field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .field input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,240,74,.08);
    }
    .field input[type="number"]::placeholder { color: var(--muted); }

    /* URL preview */
    .url-preview {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      margin-top: 14px;
      word-break: break-all;
      line-height: 1.6;
    }
    .url-preview .url-static { color: var(--muted); }
    .url-preview .url-id    { color: var(--accent); font-weight: 700; }

    /* Load button */
    .btn-load {
      background: var(--accent);
      color: #0b0c0f;
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 13px 28px;
      cursor: pointer;
      transition: background .18s, transform .12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-load:hover  { background: #d8ff60; transform: translateY(-1px); }
    .btn-load:active { background: var(--accent2); transform: translateY(0); }

    /* ── PLAYER CONTAINER ── */
    .player-wrap {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .player-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }
    .dot.live {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px var(--accent); }
      50%      { box-shadow: 0 0 14px var(--accent); }
    }

    .player-id-badge {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      background: rgba(200,240,74,.08);
      border: 1px solid rgba(200,240,74,.15);
      border-radius: 4px;
      padding: 3px 10px;
      letter-spacing: .06em;
      display: none;
    }

    /* Iframe placeholder */
    .iframe-slot {
      position: relative;
      min-height: 600px;
      background: var(--bg);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
    }

    .placeholder svg { opacity: .25; }

    .placeholder p {
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .5;
    }

    #embed-frame {
      display: none;
      width: 100%;
      height: 600px;
      border: none;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .frame-visible { display: block !important; animation: fadeIn .4s ease; }

    /* ── FOOTER ── */
    .footer-note {
      margin-top: 24px;
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
    }

    /* ── SHAKE ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    @media (max-width: 560px) {
      .btn-load { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8f04a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </div>
    <h1>Embed<span>Viewer</span></h1>
    <div class="divider"></div>
  </header>

  <div class="panel">
    <p class="panel-label">// controle de conteúdo</p>
    <div class="input-row">
      <div class="field">
        <label>ID do conteúdo</label>
        <input
          id="content-id"
          type="number"
          min="1"
          placeholder="ex: 550"
          autocomplete="off"
        />
      </div>
      <button class="btn-load" onclick="loadEmbed()">Carregar →</button>
    </div>
    <div class="url-preview">
      <span class="url-static">https://myembed.biz/filme/</span><span
        class="url-id" id="url-id-part">___</span>
    </div>
  </div>

  <div class="player-wrap">
    <div class="player-header">
      <div class="player-status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">AGUARDANDO INPUT</span>
      </div>
      <div class="player-id-badge" id="id-badge">ID: —</div>
    </div>

    <div class="iframe-slot">
      <div class="placeholder" id="placeholder">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <p>Insira um ID e clique em Carregar</p>
      </div>

      <iframe
        id="embed-frame"
        src=""
        width="100%"
        height="600"
        frameborder="0"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <p class="footer-note">BASE URL → https://myembed.biz/filme/{id}</p>

  <script>
    const input       = document.getElementById('content-id');
    const urlIdPart   = document.getElementById('url-id-part');
    const frame       = document.getElementById('embed-frame');
    const placeholder = document.getElementById('placeholder');
    const statusDot   = document.getElementById('status-dot');
    const statusText  = document.getElementById('status-text');
    const idBadge     = document.getElementById('id-badge');

    input.addEventListener('input', () => {
      const val = input.value.trim();
      urlIdPart.textContent = val !== '' ? val : '___';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') loadEmbed();
    });

    function loadEmbed() {
      const val = input.value.trim();

      if (!val || isNaN(val) || Number(val) < 1) {
        shake(input);
        return;
      }

      const id  = parseInt(val, 10);
      const url = `https://myembed.biz/filme/${id}`;

      frame.src = url;
      placeholder.style.display = 'none';
      frame.classList.add('frame-visible');

      statusDot.classList.add('live');
      statusText.textContent = `CARREGANDO ID ${id}`;
      idBadge.textContent    = `ID: ${id}`;
      idBadge.style.display  = 'block';

      frame.onload = () => {
        statusText.textContent = `EXIBINDO ID ${id}`;
      };
    }

    function shake(el) {
      el.style.animation   = 'none';
      el.offsetHeight;
      el.style.animation   = 'shake .3s ease';
      el.style.borderColor = '#ff4d4d';
      el.style.boxShadow   = '0 0 0 3px rgba(255,77,77,.12)';
      setTimeout(() => {
        el.style.borderColor = '';
        el.style.boxShadow   = '';
        el.style.animation   = '';
      }, 600);
    }
  </script>
</body>
</html>
