<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0c0f;
      --surface:  #13151a;
      --border:   #1e2028;
      --accent:   #c8f04a;
      --accent2:  #697A21;
      --text:     #e8eaf0;
      --muted:    #555966;
      --radius:   6px;
      --mono:     'Space Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
    }
    header h1 span { color: var(--accent); }

    .divider {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── CONTROL PANEL ── */
    .panel {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 70%);
    }

    .panel-label {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      font-family: var(--mono);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .field label {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .field input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 1.1rem;
      padding: 12px 16px;
      width: 100%;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,240,74,.08);
    }
    .field input[type="text"]::placeholder { color: var(--muted); }

    /* ── MODE SELECTOR (Nome / TMDB ID / IMDB ID) ── */
    .mode-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .mode-field label {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .mode-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 9px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background .18s, color .18s;
      white-space: nowrap;
    }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      color: #0b0c0f;
    }

    /* Results list */
    .results-list {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      position: relative;
      overflow: hidden;
    }
    .result-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .18s;
    }
    .result-item:hover { border-color: var(--accent); background: rgba(200,240,74,.04); }
    .result-item:hover::before { opacity: 1; }
    .result-item.selected { border-color: var(--accent); background: rgba(200,240,74,.06); }
    .result-item.selected::before { opacity: 1; }

    .result-poster {
      width: 36px;
      height: 54px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      background: var(--border);
    }
    .result-poster-placeholder {
      width: 36px;
      height: 54px;
      border-radius: 3px;
      flex-shrink: 0;
      background: var(--border);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .6rem;
    }

    .result-info { flex: 1; min-width: 0; }
    .result-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .result-meta {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .result-id {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      background: rgba(200,240,74,.08);
      border: 1px solid rgba(200,240,74,.15);
      border-radius: 4px;
      padding: 2px 8px;
      flex-shrink: 0;
    }

    /* Loading spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-status {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: .06em;
      min-height: 1rem;
    }

    /* URL preview */
    .url-preview {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      margin-top: 14px;
      word-break: break-all;
      line-height: 1.6;
    }
    .url-preview .url-static { color: var(--muted); }
    .url-preview .url-id    { color: var(--accent); font-weight: 700; }

    /* Load button */
    .btn-load {
      background: var(--accent);
      color: #0b0c0f;
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 13px 28px;
      cursor: pointer;
      transition: background .18s, transform .12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-load:hover  { background: #d8ff60; transform: translateY(-1px); }
    .btn-load:active { background: var(--accent2); transform: translateY(0); }

    /* ── PLAYER CONTAINER ── */
    .player-wrap {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .player-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .3s;
    }
    .dot.live {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px var(--accent); }
      50%      { box-shadow: 0 0 14px var(--accent); }
    }

    .player-id-badge {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      background: rgba(200,240,74,.08);
      border: 1px solid rgba(200,240,74,.15);
      border-radius: 4px;
      padding: 3px 10px;
      letter-spacing: .06em;
      display: none;
    }

    /* Iframe placeholder */
    .iframe-slot {
      position: relative;
      min-height: 600px;
      background: var(--bg);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
    }

    .placeholder svg { opacity: .25; }

    .placeholder p {
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .5;
    }

    #embed-frame {
      display: none;
      width: 100%;
      height: 600px;
      border: none;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .frame-visible { display: block !important; animation: fadeIn .4s ease; }

    /* ── FOOTER ── */
    .footer-note {
      margin-top: 24px;
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
    }

    /* ── SHAKE ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    @media (max-width: 560px) {
      .btn-load { width: 100%; text-align: center; }
      .input-row { flex-direction: column; align-items: stretch; }
      .mode-field { width: 100%; }
      .mode-toggle { justify-content: stretch; }
      .mode-btn { flex: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8f04a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </div>
    <h1>Embed<span>Viewer</span></h1>
    <div class="divider"></div>
  </header>

  <div class="panel">
    <p class="panel-label">// busca de conteúdo</p>
    <div class="input-row">
      <div class="field">
        <label id="search-label">Nome do filme</label>
        <input
          id="search-input"
          type="text"
          placeholder="ex: Tropa de Elite"
          autocomplete="off"
        />
      </div>

      <div class="mode-field">
        <label>Buscar por</label>
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" data-mode="nome" onclick="setMode('nome')">Nome</button>
          <button type="button" class="mode-btn" data-mode="tmdb" onclick="setMode('tmdb')">TMDB ID</button>
          <button type="button" class="mode-btn" data-mode="imdb" onclick="setMode('imdb')">IMDB ID</button>
        </div>
      </div>

      <div class="spinner" id="spinner"></div>
      <button class="btn-load" onclick="searchFilme()">Buscar →</button>
    </div>
    <div class="search-status" id="search-status"></div>
    <div class="results-list" id="results-list"></div>

    <div class="url-preview" id="url-preview" style="display:none">
      <span class="url-static">https://myembed.biz/filme/</span><span
        class="url-id" id="url-id-part">___</span>
    </div>
  </div>

  <div class="player-wrap">
    <div class="player-header">
      <div class="player-status">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">AGUARDANDO INPUT</span>
      </div>
      <div class="player-id-badge" id="id-badge">ID: —</div>
    </div>

    <div class="iframe-slot">
      <div class="placeholder" id="placeholder">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <p>Busque um filme e selecione da lista</p>
      </div>

      <iframe
        id="embed-frame"
        src=""
        width="100%"
        height="600"
        frameborder="0"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <p class="footer-note">WEBHOOK → n8n.srv1272435.hstgr.cloud/webhook/busca-filme · EMBED → myembed.biz/filme/{id}</p>

  <script>
    const searchInput  = document.getElementById('search-input');
    const searchLabel  = document.getElementById('search-label');
    const spinner      = document.getElementById('spinner');
    const searchStatus = document.getElementById('search-status');
    const resultsList  = document.getElementById('results-list');
    const urlPreview   = document.getElementById('url-preview');
    const urlIdPart    = document.getElementById('url-id-part');
    const frame        = document.getElementById('embed-frame');
    const placeholder  = document.getElementById('placeholder');
    const statusDot    = document.getElementById('status-dot');
    const statusText   = document.getElementById('status-text');
    const idBadge      = document.getElementById('id-badge');

    const WEBHOOK = 'https://n8n.srv1272435.hstgr.cloud/webhook/busca-filme';
    const POSTER_BASE = 'https://image.tmdb.org/t/p/w92';

    // ── modo de busca: 'nome' | 'tmdb' | 'imdb' ──
    let searchMode = 'nome';

    const MODE_CONFIG = {
      nome: { label: 'Nome do filme',     placeholder: 'ex: Tropa de Elite' },
      tmdb: { label: 'Código TMDB',       placeholder: 'ex: 603692' },
      imdb: { label: 'Código IMDB',       placeholder: 'ex: tt10366206' },
    };

    function setMode(mode) {
      searchMode = mode;

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      const cfg = MODE_CONFIG[mode];
      searchLabel.textContent   = cfg.label;
      searchInput.placeholder   = cfg.placeholder;

      // limpa resultados/estado ao trocar de modo
      searchInput.value = '';
      resultsList.innerHTML = '';
      searchStatus.textContent = '';
      urlPreview.style.display = 'none';
    }

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') searchFilme();
    });

    async function searchFilme() {
      const query = searchInput.value.trim();
      if (!query) { shake(searchInput); return; }

      // Busca por ID (TMDB ou IMDB) → carrega direto, sem passar pela lista de resultados
      if (searchMode === 'tmdb' || searchMode === 'imdb') {
        loadById(searchMode, query);
        return;
      }

      // Busca por nome → fluxo original via webhook + lista de resultados
      spinner.style.display = 'block';
      searchStatus.textContent = 'Buscando...';
      resultsList.innerHTML = '';
      urlPreview.style.display = 'none';

      try {
        const url = `${WEBHOOK}?filme=${encodeURIComponent(query)}`;
        const res  = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const results = data.results || [];
        spinner.style.display = 'none';

        if (results.length === 0) {
          searchStatus.textContent = 'Nenhum resultado encontrado.';
          return;
        }

        searchStatus.textContent = `${results.length} resultado(s) encontrado(s) — selecione um para carregar`;
        renderResults(results);

      } catch (err) {
        spinner.style.display = 'none';
        searchStatus.textContent = `Erro ao buscar: ${err.message}`;
      }
    }

    function renderResults(results) {
      resultsList.innerHTML = '';
      results.forEach(movie => {
        const year = movie.release_date ? movie.release_date.slice(0, 4) : '—';
        const score = movie.vote_average ? movie.vote_average.toFixed(1) : '—';

        const item = document.createElement('div');
        item.className = 'result-item';
        item.setAttribute('data-id', movie.id);

        const posterHTML = movie.poster_path
          ? `<img class="result-poster" src="${POSTER_BASE}${movie.poster_path}" alt="${movie.title}" loading="lazy" />`
          : `<div class="result-poster-placeholder">NO IMG</div>`;

        item.innerHTML = `
          ${posterHTML}
          <div class="result-info">
            <div class="result-title">${movie.title}</div>
            <div class="result-meta">${movie.original_title} · ${year} · ★ ${score}</div>
          </div>
          <div class="result-id">#${movie.id}</div>
        `;

        item.addEventListener('click', () => selectResult(item, movie.id, movie.title));
        resultsList.appendChild(item);
      });
    }

    function selectResult(el, id, title) {
      // Deselect all
      document.querySelectorAll('.result-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');

      loadEmbed(id, title);
    }

    // Carrega direto por código TMDB ou IMDB, sem lista de resultados.
    // Obs: ajuste o path abaixo caso o myembed.biz use uma rota diferente para IMDB.
    function loadById(mode, code) {
      resultsList.innerHTML = '';
      searchStatus.textContent = '';

      if (mode === 'imdb' && !/^tt\d+$/i.test(code)) {
        searchStatus.textContent = 'Código IMDB inválido — use o formato tt1234567.';
        shake(searchInput);
        return;
      }
      if (mode === 'tmdb' && !/^\d+$/.test(code)) {
        searchStatus.textContent = 'Código TMDB inválido — use apenas números.';
        shake(searchInput);
        return;
      }

      const embedPath = mode === 'imdb' ? `imdb/${code}` : `${code}`;
      loadEmbed(code, `${mode.toUpperCase()} · ${code}`, embedPath);
    }

    function loadEmbed(id, title, pathOverride) {
      // Update URL preview
      urlIdPart.textContent = pathOverride || id;
      urlPreview.style.display = 'block';

      // Load iframe
      const url = `https://myembed.biz/filme/${pathOverride || id}`;
      frame.src = url;
      placeholder.style.display = 'none';
      frame.classList.add('frame-visible');

      statusDot.classList.add('live');
      statusText.textContent = `CARREGANDO · ${title.toUpperCase()}`;
      idBadge.textContent    = `ID: ${id}`;
      idBadge.style.display  = 'block';

      frame.onload = () => {
        statusText.textContent = `EXIBINDO · ${title.toUpperCase()}`;
      };
    }

    function shake(el) {
      el.style.animation   = 'none';
      el.offsetHeight;
      el.style.animation   = 'shake .3s ease';
      el.style.borderColor = '#ff4d4d';
      el.style.boxShadow   = '0 0 0 3px rgba(255,77,77,.12)';
      setTimeout(() => {
        el.style.borderColor = '';
        el.style.boxShadow   = '';
        el.style.animation   = '';
      }, 600);
    }
  </script>
</body>
</html>
